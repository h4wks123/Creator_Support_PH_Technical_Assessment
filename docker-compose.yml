services:
  db:
    image: postgres:17
    container_name: apps_db
    ports:
      - "5432:5432"
    volumes:
      - apps_db_data:/var/lib/postgresql/data
      - ./apps/api/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: dockerfile
    container_name: apps_api
    command: npm run dev
    ports:
      - "5000:5000"
    volumes:
      - ./apps/api:/app
      - api_node_modules:/app/node_modules
    environment:
      WATCHPACK_POLLING: "true"
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: dockerfile
      target: development
    container_name: apps_web
    ports:
      - "3000:3000"
    environment:
      WATCHPACK_POLLING: "true"
      JWT_SECRET: ${JWT_SECRET}
      APP_API_URL: ${APP_API_URL}
      NEXT_PUBLIC_APP_API_URL: ${NEXT_PUBLIC_APP_API_URL}
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules

  webhook-consumer:
    build:
      context: ./apps/webhook-consumer
      dockerfile: dockerfile
    container_name: apps_webhook_consumer
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-development-secret}

volumes:
  apps_db_data:
  api_node_modules:
  web_node_modules:
